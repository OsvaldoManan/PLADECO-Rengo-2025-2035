<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og" font-family="Inter, system-ui, sans-serif">
<title id="og">PLADECO Rengo 2025-2035 — el plan en una página</title>
<rect width="1200" height="630" fill="#0b1624"/>
<rect x="0" y="0" width="1200" height="6" fill="#990000"/>
<style>
  .kicker{font-size:18px;letter-spacing:.22em;fill:#aab8cc;text-transform:uppercase}
  .h1{font-family:'Source Serif 4',Georgia,serif;font-weight:700;fill:#ffffff}
  .years{font-family:'Source Serif 4',Georgia,serif;font-weight:700;fill:#e8736b}
  .idea{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:26px;fill:#eaf1fb}
  .num{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:46px;fill:#ffffff;font-variant-numeric:tabular-nums}
  .nlbl{font-size:15px;fill:#aab8cc}
  .eje{font-size:16px;fill:#eaf1fb}
  .ico{fill:none;stroke:#7ea4d8;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .foot{font-size:16px;fill:#aab8cc}
  .rule{stroke:#22324a;stroke-width:1}
</style>

<!-- Encabezado institucional -->
<text x="70" y="74" class="kicker">Ilustre Municipalidad de Rengo · SECPLAC</text>
<!-- Título -->
<text x="70" y="150" class="h1" font-size="58">Plan de Desarrollo Comunal</text>
<text x="70" y="214" class="h1" font-size="58">de Rengo <tspan class="years">2025–2035</tspan></text>
<!-- Idea fuerza -->
<text x="70" y="268" class="idea">Una década para construir, con la voz de toda la comuna,</text>
<text x="70" y="302" class="idea">el Rengo que soñamos: más moderno, inclusivo y equilibrado.</text>

<line x1="70" y1="340" x2="1130" y2="340" class="rule"/>

<!-- Cifras clave -->
<g>
  <text x="70"  y="400" class="num">63.620</text><text x="70"  y="424" class="nlbl">habitantes (Censo 2024)</text>
  <text x="340" y="400" class="num">6</text>     <text x="340" y="424" class="nlbl">ejes estratégicos</text>
  <text x="470" y="400" class="num">32</text>    <text x="470" y="424" class="nlbl">objetivos</text>
  <text x="620" y="400" class="num">225</text>   <text x="620" y="424" class="nlbl">políticas públicas</text>
  <text x="820" y="400" class="num">21</text>    <text x="820" y="424" class="nlbl">unidades vecinales</text>
</g>

<line x1="70" y1="452" x2="1130" y2="452" class="rule"/>

<!-- Los 6 ejes con íconos del sistema -->
<g transform="translate(70,488)">
  <!-- Social · people -->
  <g class="ico" transform="translate(0,0) scale(1.2)"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.6"/><path d="M17.2 13.6A5.6 5.6 0 0 1 20.5 19"/></g>
  <text x="34" y="20" class="eje">Social</text>
  <!-- Económico · money -->
  <g class="ico" transform="translate(180,2) scale(1.2)"><rect x="3" y="6.5" width="18" height="11" rx="1.8"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9v6M17.5 9v6"/></g>
  <text x="214" y="20" class="eje">Económico</text>
  <!-- Educación · education -->
  <g class="ico" transform="translate(400,2) scale(1.2)"><path d="M12 4 2.5 9 12 14l9.5-5z"/><path d="M6 11v5c0 1.4 2.7 3 6 3s6-1.6 6-3v-5"/></g>
  <text x="434" y="20" class="eje">Educación</text>
  <!-- Urbano/MA · tree -->
  <g class="ico" transform="translate(620,0) scale(1.2)"><path d="M12 3 7 10.5h3.2L6 17h12l-4.2-6.5H17z"/><path d="M12 17v4"/><path d="M9.5 21h5"/></g>
  <text x="654" y="20" class="eje">Urbano / M. Ambiente</text>
  <!-- Seguridad · shield (segunda fila) -->
  <g class="ico" transform="translate(0,42) scale(1.2)"><path d="M12 3.5 5 6.2v5.3c0 4.2 3 7.4 7 9 4-1.6 7-4.8 7-9V6.2Z"/></g>
  <text x="34" y="62" class="eje">Seguridad</text>
  <!-- Gestión · gear -->
  <g class="ico" transform="translate(180,44) scale(1.2)"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></g>
  <text x="214" y="62" class="eje">Gestión institucional</text>
</g>

<!-- Pie -->
<text x="70" y="606" class="foot">osvaldomanan.github.io/PLADECO-Rengo-2025-2035</text>
<text x="1130" y="606" text-anchor="end" class="foot">Instrumento oficial de planificación comunal</text>
</svg>
