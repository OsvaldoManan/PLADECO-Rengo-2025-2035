<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" aria-labelledby="a4" font-family="Inter, system-ui, sans-serif">
<title id="a4">PLADECO Rengo 2025-2035 — el plan en una página (A4)</title>
<rect width="794" height="1123" fill="#ffffff"/>
<rect x="0" y="0" width="794" height="8" fill="#990000"/>
<style>
  .kicker{font-size:13px;letter-spacing:.2em;fill:#475569;text-transform:uppercase}
  .h1{font-family:'Source Serif 4',Georgia,serif;font-weight:700;fill:#1F3864}
  .years{font-family:'Source Serif 4',Georgia,serif;font-weight:700;fill:#990000}
  .idea{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:20px;fill:#1f2a3a}
  .sechead{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;fill:#475569}
  .num{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:40px;fill:#1F3864;font-variant-numeric:tabular-nums}
  .nlbl{font-size:13px;fill:#475569}
  .eje{font-size:16px;fill:#0b1624}
  .ejed{font-size:12.5px;fill:#475569}
  .ico{fill:none;stroke:#1F3864;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rule{stroke:#e2e8f0;stroke-width:1}
  .foot{font-size:12px;fill:#64748b}
</style>

<text x="64" y="78" class="kicker">Ilustre Municipalidad de Rengo · SECPLAC</text>
<text x="64" y="138" class="h1" font-size="40">Plan de Desarrollo Comunal</text>
<text x="64" y="184" class="h1" font-size="40">de Rengo <tspan class="years">2025–2035</tspan></text>
<text x="64" y="236" class="idea">Una década para construir, con la voz de toda la</text>
<text x="64" y="262" class="idea">comuna, el Rengo que soñamos.</text>

<line x1="64" y1="300" x2="730" y2="300" class="rule"/>
<text x="64" y="332" class="sechead">El plan en cifras</text>
<g>
  <text x="64"  y="392" class="num">63.620</text><text x="64"  y="416" class="nlbl">habitantes (Censo 2024)</text>
  <text x="420" y="392" class="num">21</text>    <text x="420" y="416" class="nlbl">unidades vecinales</text>
  <text x="64"  y="470" class="num">6</text>     <text x="64"  y="494" class="nlbl">ejes estratégicos</text>
  <text x="200" y="470" class="num">32</text>    <text x="200" y="494" class="nlbl">objetivos</text>
  <text x="420" y="470" class="num">225</text>   <text x="420" y="494" class="nlbl">políticas públicas</text>
</g>

<line x1="64" y1="540" x2="730" y2="540" class="rule"/>
<text x="64" y="572" class="sechead">Seis ejes estratégicos</text>
<g transform="translate(64,596)">
  <g class="ico" transform="translate(0,0) scale(1.3)"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.6"/><path d="M17.2 13.6A5.6 5.6 0 0 1 20.5 19"/></g>
  <text x="44" y="14" class="eje">Social</text><text x="44" y="32" class="ejed">Inclusión, NNA, adultos mayores, salud.</text>

  <g class="ico" transform="translate(0,56) scale(1.3)"><rect x="3" y="6.5" width="18" height="11" rx="1.8"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9v6M17.5 9v6"/></g>
  <text x="44" y="70" class="eje">Económico</text><text x="44" y="88" class="ejed">Empleo, fomento productivo, inversión.</text>

  <g class="ico" transform="translate(0,112) scale(1.3)"><path d="M12 4 2.5 9 12 14l9.5-5z"/><path d="M6 11v5c0 1.4 2.7 3 6 3s6-1.6 6-3v-5"/></g>
  <text x="44" y="126" class="eje">Educación</text><text x="44" y="144" class="ejed">Cobertura, calidad y pertinencia.</text>

  <g class="ico" transform="translate(0,168) scale(1.3)"><path d="M12 3 7 10.5h3.2L6 17h12l-4.2-6.5H17z"/><path d="M12 17v4"/><path d="M9.5 21h5"/></g>
  <text x="44" y="182" class="eje">Urbano / Medio Ambiente</text><text x="44" y="200" class="ejed">Espacios públicos, áreas verdes, riesgo.</text>

  <g class="ico" transform="translate(0,224) scale(1.3)"><path d="M12 3.5 5 6.2v5.3c0 4.2 3 7.4 7 9 4-1.6 7-4.8 7-9V6.2Z"/></g>
  <text x="44" y="238" class="eje">Seguridad</text><text x="44" y="256" class="ejed">Convivencia, prevención, seguridad vial.</text>

  <g class="ico" transform="translate(0,280) scale(1.3)"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></g>
  <text x="44" y="294" class="eje">Gestión institucional</text><text x="44" y="312" class="ejed">Modernización, transparencia, datos.</text>
</g>

<line x1="64" y1="1064" x2="730" y2="1064" class="rule"/>
<text x="64" y="1090" class="foot">osvaldomanan.github.io/PLADECO-Rengo-2025-2035</text>
<text x="730" y="1090" text-anchor="end" class="foot">Instrumento oficial de planificación comunal</text>
</svg>
