<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="t3 d3" font-family="Inter, system-ui, sans-serif">
<title id="t3">Estructura del plan: 6 ejes, 32 objetivos, 225 políticas</title>
<desc id="d3">Los 6 ejes estratégicos se despliegan en 32 objetivos y 225 políticas públicas.</desc>
<style>
  .head{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:13px;fill:currentColor;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .big{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:54px;fill:#1F3864;font-variant-numeric:tabular-nums}
  .cap{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:currentColor}
  .sub{font-size:11px;fill:currentColor;opacity:.7}
  .eje{font-size:12.5px;fill:currentColor}
  .ejenum{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:11px;fill:#1F3864}
  .flow{fill:none;stroke:#1F3864;stroke-width:1.6;opacity:.55}
  .rule{stroke:currentColor;stroke-width:1;opacity:.15}
  @media (prefers-color-scheme: dark){.big{fill:#7ea4d8}.ejenum{fill:#7ea4d8}.flow{stroke:#7ea4d8}}
</style>
<text x="20" y="26" class="head">Arquitectura estratégica</text>
<line x1="20" y1="40" x2="960" y2="40" class="rule"/>

<!-- Columna A · 6 EJES -->
<g transform="translate(40,70)">
  <text x="0" y="46" class="big">6</text>
  <text x="0" y="68" class="cap">Ejes estratégicos</text>
  <g transform="translate(0,86)">
    <text x="0" y="0"><tspan class="ejenum">01</tspan><tspan class="eje" dx="8">Social</tspan></text>
    <text x="0" y="24"><tspan class="ejenum">02</tspan><tspan class="eje" dx="8">Económico</tspan></text>
    <text x="0" y="48"><tspan class="ejenum">03</tspan><tspan class="eje" dx="8">Educación</tspan></text>
    <text x="0" y="72"><tspan class="ejenum">04</tspan><tspan class="eje" dx="8">Urbano / Medio Ambiente</tspan></text>
    <text x="0" y="96"><tspan class="ejenum">05</tspan><tspan class="eje" dx="8">Seguridad</tspan></text>
    <text x="0" y="120"><tspan class="ejenum">06</tspan><tspan class="eje" dx="8">Gestión institucional</tspan></text>
  </g>
</g>

<!-- flujo A -> B (se despliega) -->
<path class="flow" d="M330 150 C400 150, 410 150, 470 150 m-9 -5 l9 5 -9 5"/>

<!-- Columna B · 32 OBJETIVOS -->
<g transform="translate(480,70)">
  <text x="0" y="46" class="big">32</text>
  <text x="0" y="68" class="cap">Objetivos estratégicos</text>
  <text x="0" y="90" class="sub">Cada eje se despliega en</text>
  <text x="0" y="106" class="sub">objetivos medibles.</text>
</g>

<!-- flujo B -> C -->
<path class="flow" d="M700 150 C740 150, 740 150, 700 150 M700 150 H770 m-9 -5 l9 5 -9 5"/>

<!-- Columna C · 225 POLÍTICAS -->
<g transform="translate(740,70)">
  <text x="0" y="46" class="big">225</text>
  <text x="0" y="68" class="cap">Políticas públicas</text>
  <text x="0" y="90" class="sub">Acciones concretas con</text>
  <text x="0" y="106" class="sub">responsable e indicador.</text>
</g>

<line x1="20" y1="300" x2="960" y2="300" class="rule"/>
<text x="20" y="320" class="sub">Lectura: 6 ejes → 32 objetivos → 225 políticas · de lo general a lo accionable.</text>
</svg>
