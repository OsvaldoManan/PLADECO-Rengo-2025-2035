<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img" aria-labelledby="t2 d2" font-family="Inter, system-ui, sans-serif">
<title id="t2">Las cuatro dimensiones del Modelo de Bienestar Humano Territorial (MBHT)</title>
<desc id="d2">Accesibilidad, Ambiental, Socioeconómica y Seguridad se combinan en un índice de bienestar por manzana censal.</desc>
<style>
  .line{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:currentColor}
  .desc{font-size:10.5px;fill:currentColor;opacity:.72}
  .head{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:13px;fill:currentColor;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .box{fill:none;stroke:currentColor;stroke-width:1;opacity:.35}
  .conv{fill:none;stroke:#1F3864;stroke-width:1.4;opacity:.6}
  .idxbox{fill:none;stroke:#1F3864;stroke-width:1.8}
  .idxttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:#1F3864}
  @media (prefers-color-scheme: dark){.conv{stroke:#7ea4d8}.idxbox{stroke:#7ea4d8}.idxttl{fill:#7ea4d8}}
</style>
<text x="20" y="26" class="head">Modelo de Bienestar Humano Territorial</text>
<line x1="20" y1="40" x2="960" y2="40" stroke="currentColor" stroke-width="1" opacity=".18"/>

<!-- 4 dimensiones -->
<g transform="translate(40,64)">
  <rect class="box" x="0" y="0" width="200" height="96" rx="6"/>
  <g class="line" transform="translate(16,16) scale(1.25)"><path d="M9 4 3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5Z"/><path d="M9 4v13.5M15 6.5V20"/></g>
  <text x="56" y="34" class="ttl">Accesibilidad</text>
  <text x="16" y="68" class="desc">Cercanía a servicios,</text>
  <text x="16" y="83" class="desc">equipamiento y transporte.</text>
</g>
<g transform="translate(260,64)">
  <rect class="box" x="0" y="0" width="200" height="96" rx="6"/>
  <g class="line" transform="translate(16,16) scale(1.25)"><path d="M12 3 7 10.5h3.2L6 17h12l-4.2-6.5H17z"/><path d="M12 17v4"/><path d="M9.5 21h5"/></g>
  <text x="56" y="34" class="ttl">Ambiental</text>
  <text x="16" y="68" class="desc">Áreas verdes, riesgo</text>
  <text x="16" y="83" class="desc">y calidad del entorno.</text>
</g>
<g transform="translate(480,64)">
  <rect class="box" x="0" y="0" width="200" height="96" rx="6"/>
  <g class="line" transform="translate(16,18) scale(1.15)"><rect x="3" y="6.5" width="18" height="11" rx="1.8"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9v6M17.5 9v6"/></g>
  <text x="56" y="34" class="ttl">Socioeconómica</text>
  <text x="16" y="68" class="desc">Ingreso, empleo y</text>
  <text x="16" y="83" class="desc">vulnerabilidad social.</text>
</g>
<g transform="translate(700,64)">
  <rect class="box" x="0" y="0" width="200" height="96" rx="6"/>
  <g class="line" transform="translate(16,16) scale(1.25)"><path d="M12 3.5 5 6.2v5.3c0 4.2 3 7.4 7 9 4-1.6 7-4.8 7-9V6.2Z"/></g>
  <text x="56" y="34" class="ttl">Seguridad</text>
  <text x="16" y="68" class="desc">Siniestralidad, delito</text>
  <text x="16" y="83" class="desc">y percepción.</text>
</g>

<!-- convergencia -->
<g class="conv">
  <path d="M140 160 V196 H490"/>
  <path d="M360 160 V196"/>
  <path d="M580 160 V196"/>
  <path d="M800 160 V196 H490"/>
  <path d="M490 196 V214 m-5 -9 l5 9 5 -9"/>
</g>

<!-- índice síntesis -->
<g transform="translate(330,224)">
  <rect class="idxbox" x="0" y="0" width="320" height="66" rx="7"/>
  <g class="line" transform="translate(20,21) scale(1.05)" stroke="#1F3864"><path d="M12 20S4.5 15.2 4.5 9.8A4 4 0 0 1 12 7a4 4 0 0 1 7.5 2.8C19.5 15.2 12 20 12 20Z"/></g>
  <text x="56" y="29" class="idxttl">Índice de bienestar por manzana</text>
  <text x="56" y="50" class="desc">665 manzanas censales · escala 0–100 · normalizado por dimensión</text>
</g>
</svg>
