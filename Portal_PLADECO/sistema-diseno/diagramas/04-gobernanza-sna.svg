<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="t4 d4" font-family="Inter, system-ui, sans-serif">
<title id="t4">Red de gobernanza policéntrica del PLADECO (esquema)</title>
<desc id="d4">Tipos de actor (forma) y tipos de vínculo (estilo de línea) en la gobernanza del plan. Esquema ilustrativo, no el grafo de datos.</desc>
<style>
  .head{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:13px;fill:currentColor;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .rule{stroke:currentColor;stroke-width:1;opacity:.15}
  .node{fill:none;stroke:currentColor;stroke-width:1.7}
  .hub{fill:#1F3864;stroke:#1F3864}
  .lbl{font-size:11px;fill:currentColor}
  .lblw{font-size:11px;font-weight:700;fill:#fff}
  .e-formal{fill:none;stroke:currentColor;stroke-width:1.6;opacity:.7}
  .e-colab{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:6 5;opacity:.6}
  .e-deriv{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:1.5 5;opacity:.6}
  .lgttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:12px;fill:currentColor}
  .lg{font-size:11px;fill:currentColor;opacity:.82}
  @media (prefers-color-scheme: dark){.hub{fill:#7ea4d8;stroke:#7ea4d8}}
</style>
<text x="20" y="26" class="head">Gobernanza policéntrica · análisis de redes (SNA)</text>
<line x1="20" y1="40" x2="960" y2="40" class="rule"/>

<!-- ════ RED (izquierda) ════ -->
<!-- aristas primero -->
<g>
  <path class="e-formal" d="M180 130 L330 96"/>
  <path class="e-formal" d="M330 96 L520 120"/>
  <path class="e-formal" d="M180 130 L520 120"/>
  <path class="e-colab"  d="M180 130 L100 232"/>
  <path class="e-colab"  d="M180 130 L430 206"/>
  <path class="e-colab"  d="M100 232 L430 206"/>
  <path class="e-deriv"  d="M330 96 L430 206"/>
  <path class="e-deriv"  d="M300 256 L180 130"/>
</g>
<!-- nodos -->
<!-- Municipio (hub, círculo lleno) -->
<circle class="hub" cx="180" cy="130" r="15"/>
<text x="180" y="134" text-anchor="middle" class="lblw" font-size="10">M</text>
<text x="180" y="166" text-anchor="middle" class="lbl" font-weight="700">Municipio · SECPLAC</text>
<!-- Servicios públicos (cuadrado) -->
<rect class="node" x="318" y="84" width="24" height="24" rx="2"/>
<text x="330" y="72" text-anchor="middle" class="lbl">Servicios públicos</text>
<!-- Nivel regional/nacional (cuadrado) -->
<rect class="node" x="508" y="108" width="24" height="24" rx="2"/>
<text x="520" y="156" text-anchor="middle" class="lbl">Nivel regional / nacional</text>
<!-- Juntas de Vecinos (círculo) -->
<circle class="node" cx="100" cy="232" r="13"/>
<text x="100" y="262" text-anchor="middle" class="lbl">Juntas de Vecinos</text>
<!-- COSOC / sociedad civil (círculo) -->
<circle class="node" cx="430" cy="206" r="13"/>
<text x="430" y="236" text-anchor="middle" class="lbl">COSOC / sociedad civil</text>
<!-- Sector privado (rombo) -->
<path class="node" d="M300 242 l13 14 -13 14 -13 -14 Z"/>
<text x="300" y="292" text-anchor="middle" class="lbl">Sector privado</text>

<!-- ════ LEYENDA (derecha) ════ -->
<line x1="640" y1="64" x2="640" y2="320" class="rule"/>
<g transform="translate(672,78)">
  <text x="0" y="0" class="lgttl">Tipos de actor (forma)</text>
  <circle class="hub" cx="9" cy="22" r="9"/><text x="30" y="26" class="lg">Municipio (nodo articulador)</text>
  <circle class="node" cx="9" cy="48" r="9"/><text x="30" y="52" class="lg">Comunitario / sociedad civil</text>
  <rect class="node" x="1" y="64" width="17" height="17" rx="2"/><text x="30" y="78" class="lg">Servicio público / Estado</text>
  <path class="node" d="M9 92 l9 10 -9 10 -9 -10 Z"/><text x="30" y="108" class="lg">Sector privado</text>

  <text x="0" y="148" class="lgttl">Tipos de vínculo (línea)</text>
  <line class="e-formal" x1="0" y1="166" x2="40" y2="166"/><text x="50" y="170" class="lg">Formal / institucional</text>
  <line class="e-colab" x1="0" y1="188" x2="40" y2="188"/><text x="50" y="192" class="lg">Colaboración</text>
  <line class="e-deriv" x1="0" y1="210" x2="40" y2="210"/><text x="50" y="214" class="lg">Derivación</text>

  <text x="0" y="246" class="lg" font-style="italic" opacity=".7">Policéntrica: varios centros</text>
  <text x="0" y="262" class="lg" font-style="italic" opacity=".7">de coordinación, no solo el</text>
  <text x="0" y="278" class="lg" font-style="italic" opacity=".7">municipio.</text>
</g>
</svg>
