<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="t1 d1" font-family="Inter, system-ui, sans-serif">
<title id="t1">Ciclo del PLADECO: Comprender, Diagnosticar, Decidir, Implementar</title>
<desc id="d1">Cuatro movimientos secuenciales e iterativos que estructuran el plan.</desc>
<style>
  .ink{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .accent{fill:#1F3864}.accent-s{fill:none;stroke:#1F3864;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .num{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:13px;fill:#1F3864;letter-spacing:.05em}
  .ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:18px;fill:currentColor}
  .desc{font-size:11.5px;fill:currentColor;opacity:.72}
  .head{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:13px;fill:currentColor;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  @media (prefers-color-scheme: dark){.accent{fill:#7ea4d8}.accent-s{stroke:#7ea4d8}.num{fill:#7ea4d8}}
</style>
<text x="20" y="26" class="head">El plan como proceso</text>
<line x1="20" y1="40" x2="960" y2="40" stroke="currentColor" stroke-width="1" opacity=".18"/>

<!-- conectores -->
<g class="line" opacity=".55">
  <path d="M250 120 H300 m-9 -5 l9 5 -9 5"/>
  <path d="M490 120 H540 m-9 -5 l9 5 -9 5"/>
  <path d="M730 120 H780 m-9 -5 l9 5 -9 5"/>
</g>
<!-- arco de iteración (vuelve a Comprender) -->
<path class="accent-s" stroke-dasharray="3 5" d="M850 175 C850 235, 130 235, 130 175"/>
<text x="490" y="252" text-anchor="middle" class="desc" font-style="italic">proceso iterativo · se revisa y actualiza</text>

<!-- ETAPA 01 · Comprender -->
<g transform="translate(40,70)">
  <text class="num">01</text>
  <g class="line" transform="translate(0,16) scale(1.6)"><path d="M12 6.6C10.5 5.3 8.5 4.6 6 4.6H3v13h3c2.5 0 4.5.7 6 2 1.5-1.3 3.5-2 6-2h3v-13h-3c-2.5 0-4.5.7-6 2Z"/><path d="M12 6.6v12"/></g>
  <text x="0" y="78" class="ttl">Comprender</text>
  <text x="0" y="98" class="desc">Qué es el plan,</text>
  <text x="0" y="113" class="desc">para quién y por qué.</text>
</g>
<!-- ETAPA 02 · Diagnosticar -->
<g transform="translate(280,70)">
  <text class="num">02</text>
  <g class="line" transform="translate(0,16) scale(1.6)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></g>
  <text x="0" y="78" class="ttl">Diagnosticar</text>
  <text x="0" y="98" class="desc">Datos, territorio y</text>
  <text x="0" y="113" class="desc">voz de la comunidad.</text>
</g>
<!-- ETAPA 03 · Decidir -->
<g transform="translate(520,70)">
  <text class="num">03</text>
  <g class="line" transform="translate(0,16) scale(1.6)"><path d="M12 4v16M8 20h8M4 8h16"/><path d="M4 8 1.8 13h4.4zM20 8l-2.2 5h4.4z"/><path d="M12 5 4 8m8-3 8 3"/></g>
  <text x="0" y="78" class="ttl">Decidir</text>
  <text x="0" y="98" class="desc">Ejes, objetivos y</text>
  <text x="0" y="113" class="desc">prioridades.</text>
</g>
<!-- ETAPA 04 · Implementar -->
<g transform="translate(760,70)">
  <text class="num">04</text>
  <g class="line" transform="translate(0,16) scale(1.6)"><path d="M6 21V3.5"/><path d="M6 4.5h11l-2.5 4 2.5 4H6"/></g>
  <text x="0" y="78" class="ttl">Implementar</text>
  <text x="0" y="98" class="desc">Cartera, seguimiento</text>
  <text x="0" y="113" class="desc">y rendición de cuentas.</text>
</g>
</svg>
