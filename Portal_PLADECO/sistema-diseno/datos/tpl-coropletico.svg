<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="tc" font-family="Inter, system-ui, sans-serif">
<title id="tc">Plantilla · mapa coroplético del sistema PLADECO (escala secuencial)</title>
<style>
  .ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:currentColor}
  .sub{font-size:11px;fill:currentColor;opacity:.62}
  .src{font-size:10px;fill:currentColor;opacity:.5}
  .cell{stroke:#94a3b8;stroke-width:1}
  .lg{font-size:10px;fill:currentColor;opacity:.78;font-variant-numeric:tabular-nums}
</style>
<text x="20" y="26" class="ttl">Índice por unidad territorial</text>
<text x="20" y="42" class="sub">Escala secuencial 0–100 · plantilla abstracta (geometría real = GeoJSON de UV)</text>
<!-- zonas estilizadas (abstracto, no limites reales) rellenas con la rampa secuencial seq-1..6 -->
<g class="cell">
  <rect x="40"  y="64" width="96" height="58" rx="4" fill="#c3d4ea"/>
  <rect x="142" y="64" width="120" height="58" rx="4" fill="#5580b4"/>
  <rect x="268" y="64" width="84" height="58" rx="4" fill="#8fb0d6"/>
  <rect x="358" y="64" width="86" height="58" rx="4" fill="#eaf0f8"/>
  <rect x="40"  y="128" width="120" height="62" rx="4" fill="#1F3864"/>
  <rect x="166" y="128" width="92" height="62" rx="4" fill="#2f578f"/>
  <rect x="264" y="128" width="100" height="62" rx="4" fill="#8fb0d6"/>
  <rect x="370" y="128" width="74" height="62" rx="4" fill="#c3d4ea"/>
  <rect x="40"  y="196" width="84" height="56" rx="4" fill="#5580b4"/>
  <rect x="130" y="196" width="110" height="56" rx="4" fill="#eaf0f8"/>
  <rect x="246" y="196" width="96" height="56" rx="4" fill="#2f578f"/>
  <rect x="348" y="196" width="96" height="56" rx="4" fill="#8fb0d6"/>
</g>
<!-- leyenda rampa secuencial -->
<g transform="translate(40,276)">
  <rect x="0"  y="0" width="34" height="12" fill="#eaf0f8" stroke="#94a3b8" stroke-width=".6"/>
  <rect x="34" y="0" width="34" height="12" fill="#c3d4ea" stroke="#94a3b8" stroke-width=".6"/>
  <rect x="68" y="0" width="34" height="12" fill="#8fb0d6" stroke="#94a3b8" stroke-width=".6"/>
  <rect x="102" y="0" width="34" height="12" fill="#5580b4" stroke="#94a3b8" stroke-width=".6"/>
  <rect x="136" y="0" width="34" height="12" fill="#2f578f" stroke="#94a3b8" stroke-width=".6"/>
  <rect x="170" y="0" width="34" height="12" fill="#1F3864" stroke="#94a3b8" stroke-width=".6"/>
  <text x="0" y="26" class="lg">0</text><text x="204" y="26" class="lg" text-anchor="end">100</text>
  <text x="214" y="10" class="lg">menor → mayor índice</text>
</g>
<text x="20" y="316" class="src">Fuente: PLADECO Rengo 2025-2035 · disposición ilustrativa, no límites reales.</text>
</svg>
