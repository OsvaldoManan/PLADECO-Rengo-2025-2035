<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="tl" font-family="Inter, system-ui, sans-serif">
<title id="tl">Plantilla · gráfico de líneas del sistema PLADECO</title>
<style>
  .ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:currentColor}
  .sub{font-size:11px;fill:currentColor;opacity:.62}
  .axis{stroke:#94a3b8;stroke-width:1}
  .grid{stroke:#94a3b8;stroke-width:1;opacity:.22}
  .tick{font-size:11px;fill:currentColor;opacity:.72;font-variant-numeric:tabular-nums}
  .src{font-size:10px;fill:currentColor;opacity:.5}
  .s1{fill:none;stroke:#1F3864;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .s2{fill:none;stroke:#D55E00;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 4}
  .l1{font-size:11px;font-weight:700;fill:#1F3864}.l2{font-size:11px;font-weight:700;fill:#D55E00}
  @media (prefers-color-scheme: dark){.s1{stroke:#7ea4d8}.l1{fill:#7ea4d8}.s2{stroke:#f08b53}.l2{fill:#f08b53}}
</style>
<text x="20" y="26" class="ttl">Trayectoria 2024–2035</text>
<text x="20" y="42" class="sub">Índice base 100 · plantilla de ejemplo</text>
<g class="grid"><line x1="60" y1="70" x2="430" y2="70"/><line x1="60" y1="120" x2="430" y2="120"/><line x1="60" y1="170" x2="430" y2="170"/><line x1="60" y1="220" x2="430" y2="220"/></g>
<line class="axis" x1="60" y1="70" x2="60" y2="250"/>
<line class="axis" x1="60" y1="250" x2="430" y2="250"/>
<g class="tick" text-anchor="end"><text x="52" y="74">120</text><text x="52" y="124">110</text><text x="52" y="174">100</text><text x="52" y="224">90</text></g>
<!-- serie 1 (navy, sólida) -->
<polyline class="s1" points="60,210 134,196 208,168 282,150 356,128 430,104"/>
<text x="438" y="104" class="l1">Serie A</text>
<!-- serie 2 (bermellón, discontinua) -->
<polyline class="s2" points="60,224 134,218 208,206 282,210 356,194 430,182"/>
<text x="438" y="186" class="l2">Serie B</text>
<g class="tick" text-anchor="middle"><text x="60" y="266">2024</text><text x="208" y="266">2028</text><text x="356" y="266">2032</text><text x="430" y="266">2035</text></g>
<text x="20" y="300" class="src">Fuente: PLADECO Rengo 2025-2035 · cifras de ejemplo. Etiqueta directa (sin leyenda separada).</text>
</svg>
