<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="tb" font-family="Inter, system-ui, sans-serif">
<title id="tb">Plantilla · gráfico de barras del sistema PLADECO</title>
<style>
  .ttl{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px;fill:currentColor}
  .sub{font-size:11px;fill:currentColor;opacity:.62}
  .axis{stroke:#94a3b8;stroke-width:1}
  .grid{stroke:#94a3b8;stroke-width:1;opacity:.22}
  .tick{font-size:11px;fill:currentColor;opacity:.72;font-variant-numeric:tabular-nums}
  .xlbl{font-size:11px;fill:currentColor;opacity:.85}
  .val{font-size:11px;fill:currentColor;font-weight:700;font-variant-numeric:tabular-nums}
  .src{font-size:10px;fill:currentColor;opacity:.5}
  .bar{fill:#cbd5e1}.bar-hl{fill:#1F3864}
  @media (prefers-color-scheme: dark){.bar{fill:#475569}.bar-hl{fill:#7ea4d8}}
</style>
<text x="20" y="26" class="ttl">Inversión por eje estratégico</text>
<text x="20" y="42" class="sub">Millones de pesos · plantilla de ejemplo</text>
<!-- grilla + eje Y -->
<g class="grid"><line x1="60" y1="80" x2="460" y2="80"/><line x1="60" y1="130" x2="460" y2="130"/><line x1="60" y1="180" x2="460" y2="180"/><line x1="60" y1="230" x2="460" y2="230"/></g>
<line class="axis" x1="60" y1="80" x2="60" y2="250"/>
<line class="axis" x1="60" y1="250" x2="460" y2="250"/>
<g class="tick" text-anchor="end"><text x="52" y="84">400</text><text x="52" y="134">300</text><text x="52" y="184">200</text><text x="52" y="234">100</text></g>
<!-- barras (una destacada navy; resto neutro) -->
<g>
  <rect class="bar"    x="78"  y="150" width="44" height="100"/><text x="100" y="142" text-anchor="middle" class="val">200</text>
  <rect class="bar-hl" x="140" y="96"  width="44" height="154"/><text x="162" y="88"  text-anchor="middle" class="val">308</text>
  <rect class="bar"    x="202" y="170" width="44" height="80"/> <text x="224" y="162" text-anchor="middle" class="val">160</text>
  <rect class="bar"    x="264" y="190" width="44" height="60"/> <text x="286" y="182" text-anchor="middle" class="val">120</text>
  <rect class="bar"    x="326" y="165" width="44" height="85"/> <text x="348" y="157" text-anchor="middle" class="val">170</text>
  <rect class="bar"    x="388" y="205" width="44" height="45"/> <text x="410" y="197" text-anchor="middle" class="val">90</text>
</g>
<g class="xlbl" text-anchor="middle"><text x="100" y="266">Social</text><text x="162" y="266">Económ.</text><text x="224" y="266">Educ.</text><text x="286" y="266">Urb/MA</text><text x="348" y="266">Segur.</text><text x="410" y="266">Gestión</text></g>
<text x="20" y="300" class="src">Fuente: PLADECO Rengo 2025-2035 · cifras de ejemplo.</text>
</svg>
